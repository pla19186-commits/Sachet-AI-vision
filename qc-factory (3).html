<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>QC Factory Inspector</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');

  :root {
    --bg: #0d0f12;
    --surface: #161a20;
    --surface2: #1e242d;
    --border: #2a3240;
    --accent: #ff3b3b;
    --accent2: #ff8c00;
    --green: #00e676;
    --text: #e8eaf0;
    --text2: #7a8394;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .header-count {
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* MAIN */
  .main { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    background: var(--surface2);
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-header .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card-body { padding: 14px; }

  /* SELECT / INPUT */
  select, input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color .2s;
  }
  select:focus, input[type="number"]:focus { border-color: var(--accent); }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
    pointer-events: none;
    font-size: 14px;
  }

  label { font-size: 13px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 7px; letter-spacing: .5px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* TYPE PILLS */
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 9px 16px;
    border-radius: 30px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    flex: 1;
    min-width: 80px;
    text-align: center;
  }
  .pill.active-pass   { border-color: var(--green);  background: #00e67622; color: var(--green); }
  .pill.active-leak   { border-color: var(--accent);  background: #ff3b3b22; color: var(--accent); }
  .pill.active-wrinkle{ border-color: var(--accent2); background: #ff8c0022; color: var(--accent2); }
  .pill.active-setup  { border-color: #b388ff;        background: #b388ff22; color: #b388ff; }

  /* CANVAS AREA */
  .canvas-wrap {
    position: relative;
    width: 100%;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    touch-action: none;
  }
  #mainCanvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    touch-action: none;
  }
  .canvas-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    pointer-events: none;
    gap: 10px;
    transition: opacity .3s;
  }
  .canvas-placeholder .icon { font-size: 44px; }
  .canvas-placeholder p { font-size: 14px; }

  /* TOOL BAR */
  .tool-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tool-btn {
    flex: 1;
    min-width: 70px;
    padding: 11px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all .18s;
    letter-spacing: .3px;
  }
  .tool-btn:active { transform: scale(.96); }
  .tool-btn.primary  { border-color: var(--accent);  color: var(--accent); }
  .tool-btn.camera   { border-color: #40c4ff; color: #40c4ff; }
  .tool-btn.gallery  { border-color: var(--accent2); color: var(--accent2); }
  .tool-btn.clear    { border-color: var(--text2); color: var(--text2); }

  input[type="file"] { display: none; }

  /* STROKE SIZE */
  .stroke-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .stroke-row label { margin: 0; white-space: nowrap; flex-shrink: 0; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }
  .stroke-preview {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* SAVE / DOWNLOAD BUTTONS */
  .big-btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    font-family: 'Sarabun', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .18s;
  }
  .big-btn:active { transform: scale(.97); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-dl   { background: var(--surface2); color: var(--green); border: 2px solid var(--green); }

  /* LOG */
  .log-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
  .log-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .log-thumb {
    width: 52px; height: 40px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .log-info { flex: 1; min-width: 0; }
  .log-info .row1 { font-size: 13px; font-weight: 700; margin-bottom: 3px; display: flex; gap: 8px; }
  .log-info .row2 { font-size: 12px; color: var(--text2); }
  .log-del {
    background: none; border: none; color: var(--text2);
    font-size: 20px; cursor: pointer; padding: 4px;
    transition: color .18s;
  }
  .log-del:hover { color: var(--accent); }

  /* MODE badge */
  .mode-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }
  .mode-ready  { background: #40c4ff22; color: #40c4ff; }
  .mode-inproc { background: #ff8c0022; color: var(--accent2); }

  /* TYPE badge */
  .type-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .tb-pass    { background: #00e67622; color: var(--green); }
  .tb-leak    { background: #ff3b3b22; color: var(--accent); }
  .tb-wrinkle { background: #ff8c0022; color: var(--accent2); }
  .tb-setup   { background: #b388ff22; color: #b388ff; }

  .empty-state { text-align: center; padding: 28px; color: var(--text2); font-size: 14px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--green); color: #000; font-weight: 700;
    padding: 12px 24px; border-radius: 30px; font-size: 15px;
    transition: transform .3s; z-index: 999; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">⬡ QC SCAN</div>
  <div class="header-count" id="countBadge">0 รายการ</div>
</div>

<div class="main">

  <!-- MODE SELECT -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>โหมดการตรวจ</div>
    <div class="card-body">
      <div class="select-wrap">
        <select id="modeSelect">
          <option value="readiness">🔧 ตรวจความพร้อมเครื่องจักร (Readiness)</option>
          <option value="inprocess">📦 ตรวจคุณภาพซอง (In-Process)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CAMERA / CANVAS -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>รูปภาพ &amp; วาดหมายเหตุ</div>
    <div class="card-body">

      <div class="tool-bar">
        <button class="tool-btn camera" onclick="openCamera()">📷 ถ่ายรูป</button>
        <button class="tool-btn gallery" onclick="document.getElementById('galleryInput').click()">🖼 คลังภาพ</button>
        <button class="tool-btn clear" onclick="clearDrawing()">🧹 ล้างเส้น</button>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="mainCanvas" width="600" height="450"></canvas>
        <div class="canvas-placeholder" id="placeholder">
          <div class="icon">📸</div>
          <p>ถ่ายหรืออัปโหลดรูปเพื่อเริ่มวาด</p>
        </div>
      </div>

      <div class="stroke-row">
        <label>ขนาดปากกา</label>
        <input type="range" id="strokeSize" min="2" max="30" value="5"
               oninput="updateStroke(this.value)">
        <div class="stroke-preview" id="strokePreview"></div>
      </div>

    </div>
  </div>

  <!-- FORM -->
  <div class="card">
    <div class="card-header"><span class="dot"></span>ข้อมูลการตรวจ</div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label>เครื่องจักร (Machine)</label>
          <div class="select-wrap">
            <select id="machineSelect">
              <option value="">-- เลือก --</option>
              <option value="12#A">12#A</option>
              <option value="12#B">12#B</option>
            </select>
          </div>
        </div>
        <div>
          <label>เลน (Lane)</label>
          <div class="select-wrap">
            <select id="laneSelect">
              <option value="">-- เลือก --</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
              <option>10</option><option>11</option><option>12</option>
            </select>
          </div>
        </div>
        <div style="grid-column:1/-1;">
          <label>ด้านของซอง</label>
          <div class="select-wrap">
            <select id="sideSelect">
              <option value="">-- เลือก --</option>
              <option value="Front">ด้านหน้า (Front)</option>
              <option value="Back">ด้านหลัง (Back)</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <label>ประเภทปัญหา</label>
        <div class="pill-group">
          <button class="pill" id="pill-pass"    onclick="selectType('Pass')"        >✅ Pass</button>
          <button class="pill" id="pill-leak"    onclick="selectType('Leak-Seal')"   >💧 Leak-Seal</button>
          <button class="pill" id="pill-wrinkle" onclick="selectType('Wrinkle')"     >〰 Wrinkle</button>
          <button class="pill" id="pill-setup"   onclick="selectType('Setup-Error')" >⚙ Setup-Error</button>
        </div>
      </div>

    </div>
  </div>

  <!-- SAVE -->
  <button class="big-btn btn-save" onclick="saveRecord()">💾 บันทึกรายการ</button>

  <!-- LOG -->
  <div class="card">
    <div class="card-header">
      <span class="dot"></span>รายการที่บันทึก
      <button onclick="clearAllRecords()" style="margin-left:auto;background:none;border:1px solid #ff3b3b44;color:#ff3b3b;border-radius:6px;padding:3px 10px;font-size:11px;font-family:'Sarabun',sans-serif;font-weight:700;cursor:pointer;letter-spacing:.5px;">🗑 ล้างทั้งหมด</button>
    </div>
    <div class="card-body" style="padding:10px 14px;">
      <div class="log-list" id="logList">
        <div class="empty-state" id="emptyState">ยังไม่มีรายการ</div>
      </div>
    </div>
  </div>

  <!-- DOWNLOAD -->
  <button class="big-btn btn-dl" onclick="downloadZip()">📦 ดาวน์โหลด ZIP ทั้งหมด</button>

</div>

<div id="toast">✓ บันทึกแล้ว</div>

<!-- Hidden inputs -->
<input type="file" id="galleryInput" accept="image/*" onchange="loadImageFile(this)">
<input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="loadImageFile(this)">

<script>
/* ───────────── LOCALSTORAGE ───────────── */
const STORAGE_KEY = 'qc_factory_records';

function persistRecords() {
  try {
    // Store only metadata + image; images are already base64 strings
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
  } catch (e) {
    // Quota exceeded (too many large images) — warn but don't crash
    showToast('⚠ พื้นที่เก็บข้อมูลเต็ม กรุณา DL ZIP แล้วล้างข้อมูล', '#ff8c00');
  }
}

function loadPersistedRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted data — ignore */ }
  return [];
}

function clearAllRecords() {
  if (!state.records.length) { showToast('⚠ ไม่มีรายการให้ล้าง', '#ff8c00'); return; }
  if (!confirm(`ล้างรายการทั้งหมด ${state.records.length} รายการ?\n(ไม่สามารถกู้คืนได้)`)) return;
  state.records = [];
  localStorage.removeItem(STORAGE_KEY);
  renderLog();
  showToast('🗑 ล้างข้อมูลแล้ว', '#ff3b3b');
}

/* ───────────── STATE ───────────── */
const state = {
  records: loadPersistedRecords(),   // ← boot: restore from storage
  selectedType: '',
  drawing: false,
  hasImage: false,
  strokeSize: 5,
};

/* ───────────── CANVAS SETUP ───────────── */
const canvas  = document.getElementById('mainCanvas');
const ctx     = canvas.getContext('2d');
let bgLayer   = null; // offscreen canvas for background image

function getPos(e, isTouch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const src = isTouch ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function startDraw(e) {
  e.preventDefault();
  state.drawing = true;
  const pos = getPos(e, e.type.startsWith('touch'));
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}
function moveDraw(e) {
  e.preventDefault();
  if (!state.drawing) return;
  const pos = getPos(e, e.type.startsWith('touch'));
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = '#ff3b3b';
  ctx.lineWidth   = state.strokeSize;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();
}
function endDraw(e) { e.preventDefault(); state.drawing = false; ctx.beginPath(); }

canvas.addEventListener('mousedown',  startDraw, { passive: false });
canvas.addEventListener('mousemove',  moveDraw,  { passive: false });
canvas.addEventListener('mouseup',    endDraw,   { passive: false });
canvas.addEventListener('mouseleave', endDraw,   { passive: false });
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove',  moveDraw,  { passive: false });
canvas.addEventListener('touchend',   endDraw,   { passive: false });

/* ───────────── LOAD IMAGE ───────────── */
function loadImageFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadImageSrc(ev.target.result);
  reader.readAsDataURL(file);
  input.value = '';
}

function loadImageSrc(src) {
  const img = new Image();
  img.onload = () => {
    // Fit to canvas width, cap height at 560
    const maxW = 600, maxH = 560;
    let w = img.width, h = img.height;
    if (w > maxW) { h = h * maxW / w; w = maxW; }
    if (h > maxH) { w = w * maxH / h; h = maxH; }
    canvas.width  = Math.round(w);
    canvas.height = Math.round(h);

    // Save bg layer
    bgLayer = document.createElement('canvas');
    bgLayer.width  = canvas.width;
    bgLayer.height = canvas.height;
    bgLayer.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

    // Draw on main canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    state.hasImage = true;
    document.getElementById('placeholder').style.display = 'none';
  };
  img.src = src;
}

function clearDrawing() {
  if (!state.hasImage || !bgLayer) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bgLayer, 0, 0);
}

function updateStroke(v) {
  state.strokeSize = +v;
  const size = Math.max(8, +v * 2.4);
  document.getElementById('strokePreview').style.width  = size + 'px';
  document.getElementById('strokePreview').style.height = size + 'px';
}
updateStroke(5);

/* ───────────── CAMERA ───────────── */
function openCamera() { document.getElementById('cameraInput').click(); }

/* ───────────── TYPE SELECT ───────────── */
const typeMap = {
  'Pass':        { cls: 'active-pass',    tb: 'tb-pass',    label: '✅ Pass'        },
  'Leak-Seal':   { cls: 'active-leak',    tb: 'tb-leak',    label: '💧 Leak-Seal'   },
  'Wrinkle':     { cls: 'active-wrinkle', tb: 'tb-wrinkle', label: '〰 Wrinkle'     },
  'Setup-Error': { cls: 'active-setup',   tb: 'tb-setup',   label: '⚙ Setup-Error'  },
};
const pillIdMap = { 'Pass':'pill-pass','Leak-Seal':'pill-leak','Wrinkle':'pill-wrinkle','Setup-Error':'pill-setup' };

function selectType(t) {
  state.selectedType = t;
  Object.keys(pillIdMap).forEach(k => {
    const el = document.getElementById(pillIdMap[k]);
    el.className = 'pill';
    if (k === t) el.classList.add(typeMap[k].cls);
  });
  const m = typeMap[t];
  document.getElementById('typeDisplay').innerHTML =
    `<span class="type-badge ${m.tb}">${m.label}</span>`;
}

/* ───────────── SAVE RECORD ───────────── */
function saveRecord() {
  const machine = document.getElementById('machineSelect').value;
  const lane    = document.getElementById('laneSelect').value;
  const side    = document.getElementById('sideSelect').value;
  if (!machine)            { showToast('⚠ กรุณาเลือกเครื่องจักร',  '#ff8c00'); return; }
  if (!lane)               { showToast('⚠ กรุณาเลือกเลน',          '#ff8c00'); return; }
  if (!side)               { showToast('⚠ กรุณาเลือกด้านของซอง',   '#ff8c00'); return; }
  if (!state.selectedType) { showToast('⚠ กรุณาเลือกประเภท',       '#ff8c00'); return; }

  const mode    = document.getElementById('modeSelect').value;
  const imgData = canvas.toDataURL('image/jpeg', 0.88);
  const ts      = new Date();
  const id      = state.records.length + 1;

  state.records.push({
    id,
    mode,
    machine,
    lane,
    side,
    type: state.selectedType,
    timestamp: ts.toISOString(),
    image: imgData,
  });

  renderLog();
  persistRecords();
  showToast('✓ บันทึกแล้ว');
}

/* ───────────── RENDER LOG ───────────── */
function renderLog() {
  const list = document.getElementById('logList');
  const empty = document.getElementById('emptyState');
  document.getElementById('countBadge').textContent = state.records.length + ' รายการ';

  if (!state.records.length) { list.innerHTML = ''; list.appendChild(empty); return; }
  list.innerHTML = '';

  [...state.records].reverse().forEach(r => {
    const modeLabel = r.mode === 'readiness'
      ? '<span class="mode-badge mode-ready">Readiness</span>'
      : '<span class="mode-badge mode-inproc">In-Process</span>';
    const typeInfo  = typeMap[r.type];
    const d = new Date(r.timestamp);
    const timeStr = d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });

    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `
      <img class="log-thumb" src="${r.image}" alt="">
      <div class="log-info">
        <div class="row1">
          ${modeLabel}
          <span class="type-badge ${typeInfo.tb}">${typeInfo.label}</span>
        </div>
        <div class="row2">${r.machine || ''} · เลน ${r.lane} · ${r.side === 'Front' ? 'ด้านหน้า' : r.side === 'Back' ? 'ด้านหลัง' : ''} &nbsp;·&nbsp; ${timeStr}</div>
      </div>
      <button class="log-del" onclick="deleteRecord(${r.id})">✕</button>
    `;
    list.appendChild(div);
  });
}

function deleteRecord(id) {
  state.records = state.records.filter(r => r.id !== id);
  persistRecords();
  renderLog();
}

/* ───────────── DOWNLOAD ZIP ───────────── */
async function downloadZip() {
  if (!state.records.length) { showToast('⚠ ไม่มีรายการ', '#ff8c00'); return; }
  showToast('⏳ กำลังสร้าง ZIP…', '#40c4ff');

  const zip = new JSZip();
  const folder = zip.folder('QC_Report');

  // CSV
  const header = 'ID,Mode,Machine,Lane,Side,Type,Timestamp\n';
  const rows = state.records.map(r =>
    `${r.id},"${r.mode}","${r.machine || ''}","${r.lane}","${r.side || ''}","${r.type}","${r.timestamp}"`
  ).join('\n');
  folder.file('summary.csv', header + rows);

  // Images
  state.records.forEach(r => {
    const b64     = r.image.split(',')[1];
    const machine = (r.machine || 'NA').replace('#', '_');
    const side    = r.side || 'NA';
    const fname   = `${machine}_Lane${r.lane}_${side}_${r.type}_${String(r.id).padStart(3,'0')}.jpg`;
    folder.file(fname, b64, { base64: true });
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `QC_${new Date().toISOString().slice(0,10)}.zip`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ ดาวน์โหลดแล้ว');
}

/* ───────────── TOAST ───────────── */
function showToast(msg, bg = 'var(--green)') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = bg;
  t.style.color = bg === 'var(--green)' ? '#000' : '#fff';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ───────────── BOOT ───────────── */
renderLog();  // render any records loaded from localStorage
if (state.records.length) showToast(`📂 โหลดข้อมูลเดิม ${state.records.length} รายการ`, '#40c4ff');
</script>
